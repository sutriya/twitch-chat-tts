[twitch]
# Канал, чат которого озвучиваем (логин из адреса twitch.tv/<логин>)
channel = "sutriya"

[tts]
# true - каждому зрителю свой голос из списка (всегда один и тот же), false - всегда первый
voice_per_user = true
# 1.0 - обычная скорость, больше - быстрее. У Silero всего 5 ступеней:
# < 0.75 очень медленно, < 0.92 медленно, < 1.15 обычно, < 1.3 быстро, дальше очень быстро
speed = 1.2
volume = 1.0

# Модель Silero скачается сама при первом запуске в папку models:
#   "v5_6_ru" (~150 МБ) - 5 лучших русских голосов, лицензия CC BY-NC (некоммерческая)
#   "v5_cis_base_nostress" (~90 МБ) - 29 русских голосов с префиксом ru_, лицензия MIT
model = "v5_6_ru"
# Голоса v5_6_ru: xenia, baya, kseniya (женские), aidar, eugene (мужские). "all" - все голоса модели.
# Голоса v5_cis_base_nostress: ru_aigul, ru_albina, ru_alexandr, ru_alfia, ru_alfia2, ru_bogdan,
#   ru_dmitriy, ru_ekaterina, ru_vika, ru_gamat, ru_igor, ru_karina, ru_kejilgan, ru_kermen, ru_marat,
#   ru_miyau, ru_nurgul, ru_oksana, ru_onaoy, ru_ramilia, ru_roman, ru_safarhuja, ru_saida, ru_sibday,
#   ru_zara, ru_zhadyra, ru_zhazira, ru_zinaida, ru_eduard
speakers = ["xenia", "baya", "kseniya", "aidar", "eugene"]
sample_rate = 48000   # 8000, 24000 или 48000
threads = 4           # потоки процессора для синтеза

[audio]
# Пусто - устройство по умолчанию. Номер или часть названия из `python main.py --list-devices`.
# Например, "CABLE Input" для VB-Audio Virtual Cable, чтобы завести звук отдельной дорожкой в OBS.
output_device = ""

[chat]
read_names = false
name_template = "{name} пишет: {text}"
max_length = 200      # длиннее - обрезается
max_queue = 10        # если чат быстрее озвучки - старые сообщения выкидываются
skip_emotes = true    # вырезать смайлы Twitch
link_word = "ссылка"  # чем заменять ссылки
# Кто может быть озвучен: everyone, subscriber, vip, moderator, broadcaster
min_role = "everyone"
# Если задано (например "!tts"), озвучиваются только сообщения с этим префиксом
only_with_prefix = ""
# Сообщения, начинающиеся с этого, не озвучиваются (команды ботов)
ignore_prefixes = ["!"]
ignore_users = ["nightbot", "streamelements", "moobot", "streamlabs", "fossabot", "wizebot"]
# Сообщения с этими словами пропускаются целиком
banned_words = []

# Замены слов перед озвучкой
[chat.replacements]
"лол" = "ха-ха"
"кек" = "ке-ек"
"имхо" = "по-моему"
"gg" = "джи-джи"
"спс" = "спасибо"
"пж" = "пожалуйста"

# Зритель сам выбирает себе голос: "!голос 2", "!голос baya", "!голос айдар", "!голос сброс".
# Номер - позиция в списке голосов выше (speakers / voices). Выбор сохраняется в user_voices.json.
[voice_command]
enabled = true
commands = ["!голос", "!voice"]
# Что сказать новым голосом после смены ({name} - ник, {voice} - голос). Пусто - молча.
confirm_text = "Теперь я говорю так"

# Русские названия голосов, которые можно писать после команды
[voice_command.aliases]
"ксения" = "xenia"
"бая" = "baya"
"байя" = "baya"
"ксюша" = "kseniya"
"айдар" = "aidar"
"евгений" = "eugene"
"женя" = "eugene"
